<text x="57" y="168" font-size="23" font-weight="700">Developer</text><text x="57" y="200" font-size="16">Ekrany · tagi · logika</text><text x="57" y="228" font-size="16">Tworzenie i edycja projektu</text>
<text x="441" y="168" font-size="23" font-weight="700">Runtime</text><text x="441" y="200" font-size="16">Aktywny projekt i repozytorium</text><text x="441" y="228" font-size="16">Usługa Windows</text>
<text x="832" y="168" font-size="23" font-weight="700">Client</text><text x="832" y="200" font-size="16">Wizualizacja i sterowanie</text><text x="832" y="228" font-size="16">Sesja operatora</text>
<text x="319" y="404" font-size="21" font-weight="700">Sterowniki PLC</text><text x="319" y="436" font-size="15">OPC UA · S7 Plus · Modbus</text>
