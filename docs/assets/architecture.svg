<rect width="1100" height="510" rx="20" fill="#f0f5f8"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#182c43"><text x="35" y="47" font-size="23" font-weight="700">Jeden projekt. Trzy odpowiedzialności.</text><text x="35" y="76" font-size="15" fill="#52677d">Komunikację i archiwizację prowadzi usługa Runtime.</text>
