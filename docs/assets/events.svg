<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="395" viewBox="0 0 1100 395" role="img" aria-labelledby="title desc">
<title id="title">Kolejność zdarzeń zapisu</title><desc id="desc">Kontrola typu i zakresu, zdarzenie Przed przyjęciem wartości, Wartość przyjęta, zapis do źródła, a następnie Zapis zakończony albo Błąd zapisu. Odrzucona walidacja zatrzymuje zapis.</desc>
<rect width="1100" height="395" rx="20" fill="#f0f5f8"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#182c43"><text x="35" y="48" font-size="23" font-weight="700">Przyjęcie wartości i potwierdzenie zapisu to różne zdarzenia</text>
<g fill="white" stroke="#c6d6e0"><rect x="35" y="115" width="175" height="103" rx="12"/><rect x="249" y="115" width="186" height="103" rx="12"/><rect x="474" y="115" width="174" height="103" rx="12"/><rect x="687" y="115" width="150" height="103" rx="12"/><rect x="885" y="84" width="180" height="72" rx="12" stroke="#128577"/><rect x="885" y="191" width="180" height="72" rx="12" stroke="#c05858"/></g>
<g font-size="18" text-anchor="middle" font-weight="600"><text x="122" y="153">Typ i zakres</text><text x="122" y="182" font-size="14" font-weight="400">kontrola wejścia</text><text x="342" y="151">Przed przyjęciem</text><text x="342" y="179">wartości</text><text x="561" y="151">Wartość</text><text x="561" y="179">przyjęta</text><text x="762" y="151">Zapis</text><text x="762" y="180" font-size="14" font-weight="400">PLC / tag HMI</text><text x="975" y="126" fill="#128577">Zapis zakończony</text><text x="975" y="235" fill="#ad3636">Błąd zapisu</text></g>
<g fill="none" stroke="#128577" stroke-width="2"><path d="M215 165H240M230 158L240 165L230 172M440 165H465M455 158L465 165L455 172M653 165H678M668 158L678 165L668 172M842 165H860V120H877M867 113L877 120L867 127M860 165V227H877M867 220L877 227L867 234"/></g>
<path d="M342 230V283H250" fill="none" stroke="#c05858" stroke-width="2"/><rect x="35" y="264" width="235" height="60" rx="10" fill="#f8e5e3"/><text x="52" y="300" font-size="16" fill="#ad3636">Odrzucono → bez zapisu</text>
<text x="35" y="365" font-size="15" fill="#52677d">Potwierdzenie protokołu nie jest potwierdzeniem fizycznego wykonania ruchu maszyny.</text></g></svg>
