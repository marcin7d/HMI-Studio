<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Skąd pochodzi wygląd obiektu</title><desc id="desc">Właściwości i styl, wiązania, animacje, stan, nadpisania skryptu. Osobno prawa i warunki dostępności. Kolory zastępują, krycie może się mnożyć.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7891a1" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="700" rx="20" fill="#f3f7fa"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#18364b">
<text x="48" y="58" font-size="15" fill="#087e6d" letter-spacing="2">WYGLĄD W CLIENT</text><text x="48" y="101" font-size="31" font-weight="700">Jedna właściwość może mieć kilka źródeł</text>
<g fill="#fff" stroke="#cfdee7"><rect x="48" y="146" width="338" height="138" rx="12"/><rect x="431" y="146" width="338" height="138" rx="12"/><rect x="814" y="146" width="338" height="138" rx="12"/><rect x="48" y="335" width="338" height="138" rx="12"/><rect x="431" y="335" width="338" height="138" rx="12"/></g>
<g font-size="23" font-weight="600"><text x="69" y="185">1  Właściwości i styl</text><text x="452" y="185">2  Wiązania</text><text x="835" y="185">3  Animacje</text><text x="69" y="374">4  Wybrany stan</text><text x="452" y="374">5  Skrypt w sesji</text></g>
<g font-size="19" fill="#50697b"><text x="69" y="222">Baza zapisana w projekcie.</text><text x="69" y="251">Uwzględnij nadpisania stylu.</text><text x="452" y="222">Stała, tag lub wyrażenie.</text><text x="452" y="251">Wynik ma wymagany typ.</text><text x="835" y="222">Tag, warunek i czas.</text><text x="835" y="251">Ruch, kolor, krycie, wzór.</text><text x="69" y="411">Najwyższy priorytet.</text><text x="69" y="440">Tylko wybrane nadpisania.</text><text x="452" y="411">Zmiana tymczasowa.</text><text x="452" y="440">Reset usuwa nadpisania.</text></g>
<path d="M392 215h32 M775 215h32 M983 291v22H217v14 M392 404h32" fill="none" stroke="#7891a1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="814" y="335" width="338" height="138" rx="12" fill="#e1f1ec"/><text x="835" y="374" font-size="23" font-weight="600">Reguły łączenia</text><text x="835" y="411" font-size="19">Kolor może być zastąpiony.</text><text x="835" y="440" font-size="19">Krycie może się mnożyć.</text>
<rect x="48" y="518" width="1104" height="132" rx="12" fill="#18364b"/><text x="72" y="557" font-size="24" font-weight="600" fill="#fff">Prawa i warunki obsługi nadal obowiązują</text><text x="72" y="593" font-size="20" fill="#d4e5ee">enabled=True nie nadaje operatorowi prawa zapisu i nie usuwa blokady z wiązania.</text><text x="72" y="625" font-size="20" fill="#d4e5ee">Widoczność może zależeć także od warstwy, uprawnień i osobnego tagu widoczności.</text>
</g></svg>
